<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple calculator built with Bootstrap"
    />
    <title>Calculator Bootstrap | IT Legend</title>
    <!-- Boostrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- CSS File -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Calculator -->
    <main
      class="bg-secondary min-vh-100 d-flex align-items-center justify-content-center"
    >
      <section class="shadow-lg overflow-hidden w-25">
        <!-- Display Row -->
        <div class="d-flex">
          <!-- Expression display -->
          <div
            class="bg-white d-flex align-items-center px-4 fs-3 fw-normal text-dark w-75"
          >
            56
          </div>
          <!-- AC Button -->
          <button
            class="btn border-0 text-white fw-semibold fs-4 bg-success p-3 w-25"
          >
            AC
          </button>
        </div>

        <!-- Keypad -->
        <div class="row g-0">
          <!-- Numbers: col-9 split into 3 columns -->
          <div class="col-9">
            <!-- Row 1 -->
            <div class="row g-0">
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  9
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  8
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  7
                </button>
              </div>
            </div>

            <!-- Row 2 -->
            <div class="row g-0">
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  4
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  5
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  6
                </button>
              </div>
            </div>

            <!-- Row 3 -->
            <div class="row g-0">
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  1
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  2
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  3
                </button>
              </div>
            </div>

            <!-- Row 4 -->
            <div class="row g-0">
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  .
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  0
                </button>
              </div>
              <div class="col-4">
                <button
                  class="btn w-100 border border-secondary-subtle text-white fs-5 py-4 bg-dark"
                >
                  =
                </button>
              </div>
            </div>
          </div>

          <!-- Operators: col-3 split into 4 rows -->
          <div class="col-3">
            <div class="row g-0">
              <div class="col-12">
                <button
                  class="btn w-100 border border-light text-white fs-5 py-4 bg-secondary"
                >
                  +
                </button>
              </div>
            </div>

            <div class="row g-0">
              <div class="col-12">
                <button
                  class="btn w-100 border border-light text-white fs-5 py-4 bg-secondary"
                >
                  −
                </button>
              </div>
            </div>

            <div class="row g-0">
              <div class="col-12">
                <button
                  class="btn w-100 border border-light text-white fs-5 py-4 bg-secondary"
                >
                  ÷
                </button>
              </div>
            </div>

            <div class="row g-0">
              <div class="col-12">
                <button
                  class="btn w-100 border border-light text-white fs-5 py-4 bg-secondary"
                >
                  ×
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bootstrap JS Bundle with Popper -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <!-- JS File -->
    <script src="./script.js"></script>
  </body>
</html>
